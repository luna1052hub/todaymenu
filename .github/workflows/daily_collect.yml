name: Update Trending Menus

on:
  schedule:
    - cron: '0 19 * * *'
  workflow_dispatch:

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 코드 가져오기
        uses: actions/checkout@v4

      - name: 파이썬 환경 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 구글 트렌드 분석 라이브러리 설치
        run: |
          pip install pytrends pandas requests

      - name: 구글 3일 평균 검색량 1~4위 수집 스크립트 실행
        run: |
          python collector.py

      - name: 깃허브 변경사항 저장
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add menu_data.json
          git commit -m "Update Top 4 Google Trending Menus" || exit 0
          git push
