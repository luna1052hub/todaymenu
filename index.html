<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>저녁밥 뭐하지?</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;600;700&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg-color: #f8f9fa;
      --card-bg: #ffffff;
      --primary-color: #ff6b6b;
      --primary-hover: #ff5252;
      --text-color: #212529;
      --subtext-color: #868e96;
      --border-color: #f1f3f5;
      --shadow-color: rgba(0, 0, 0, 0.08);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Noto Sans KR', sans-serif; }
    body { background-color: var(--bg-color); color: var(--text-color); display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 16px; }

    .app-container {
      background: var(--card-bg); width: 100%; max-width: 420px; min-height: 680px; padding: 24px 20px;
      border-radius: 20px; box-shadow: 0 10px 30px var(--shadow-color); display: flex; flex-direction: column; justify-content: space-between; position: relative;
    }

    .header { text-align: center; margin-bottom: 16px; }
    .header h1 { font-size: 24px; font-weight: 700; color: var(--primary-color); display: flex; align-items: center; justify-content: center; gap: 8px; }

    .info-card {
      background-color: #fff0f0; border-radius: 14px; padding: 14px 16px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border: 1px solid #ffe3e3;
    }
    .date-box .date-text { font-size: 15px; font-weight: 700; color: #343a40; }
    .date-box .day-text { font-size: 13px; color: var(--subtext-color); margin-top: 2px; }
    .weather-box { text-align: right; }
    .weather-box .weather-temp { font-size: 13px; font-weight: 600; color: #495057; }

    .recommend-section { flex: 1; display: flex; flex-direction: column; justify-content: center; width: 100%; }
    .placeholder-text { text-align: center; color: var(--subtext-color); font-size: 15px; line-height: 1.6; }

    /* 4개 카드가 2x2로 정확하게 보이도록 그리드 고정 */
    .menu-grid { 
      display: grid; 
      grid-template-columns: repeat(2, 1fr); 
      gap: 12px; 
      width: 100%;
      animation: fadeIn 0.4s ease-out; 
    }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

    .menu-card {
      background-color: var(--bg-color); border: 1px solid var(--border-color); border-radius: 14px; padding: 16px 8px; text-align: center; box-shadow: 0 2px 8px rgba(0,0,0,0.03); cursor: pointer; transition: transform 0.2s, border-color 0.2s; position: relative; width: 100%;
    }
    .menu-card:active { transform: scale(0.97); border-color: var(--primary-color); }
    .rank-badge { position: absolute; top: 6px; left: 6px; font-size: 9px; font-weight: 700; background: #ffe3e3; color: var(--primary-color); padding: 2px 5px; border-radius: 6px; }
    .menu-card .menu-emoji { font-size: 34px; margin: 8px 0 4px 0; }
    .menu-card .menu-name { font-size: 14px; font-weight: 700; color: var(--text-color); word-break: keep-all; }
    .menu-card .sub-tip { font-size: 10px; color: var(--primary-color); margin-top: 4px; }

    .button-group { margin-top: 20px; }
    .recommend-btn {
      width: 100%; padding: 16px; background-color: var(--primary-color); color: white; border: none; border-radius: 14px; font-size: 16px; font-weight: 700; cursor: pointer; box-shadow: 0 4px 12px rgba(255, 107, 107, 0.3); transition: background-color 0.2s, transform 0.1s;
    }
    .recommend-btn:active { transform: scale(0.98); background-color: var(--primary-hover); }

    .modal-overlay {
      display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.5); z-index: 100; justify-content: center; align-items: center; padding: 20px; animation: fadeIn 0.2s ease-out;
    }
    .modal-content { background: white; width: 100%; max-width: 360px; border-radius: 20px; padding: 24px; box-shadow: 0 10px 25px rgba(0,0,0,0.2); position: relative; }
    .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
    .modal-title { font-size: 18px; font-weight: 700; display: flex; align-items: center; gap: 6px; }
    .close-btn { background: none; border: none; font-size: 20px; cursor: pointer; color: var(--subtext-color); }
    .recipe-section { margin-bottom: 16px; }
    .recipe-section h4 { font-size: 14px; color: var(--primary-color); margin-bottom: 6px; }
    .recipe-section p, .recipe-section ol { font-size: 13px; color: #495057; line-height: 1.6; padding-left: 18px; }
    .video-btn-group { display: flex; gap: 8px; margin-top: 16px; }
    .video-btn { flex: 1; padding: 10px; border: none; border-radius: 10px; font-size: 12px; font-weight: 700; color: white; text-align: center; text-decoration: none; display: flex; align-items: center; justify-content: center; gap: 4px; }
    .youtube-btn { background-color: #ff0000; }
    .insta-btn { background: linear-gradient(45deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888); }
  </style>
</head>
<body>

  <div class="app-container">
    <div>
      <div class="header">
        <h1>🍳 저녁밥 뭐하지?</h1>
      </div>

      <div class="info-card">
        <div class="date-box">
          <div class="date-text" id="currentDate">00월 00일</div>
          <div class="day-text" id="currentDay">월요일</div>
        </div>
        <div class="weather-box">
          <div class="weather-temp" id="weatherText">⌛ 위치/날씨 조회 중...</div>
        </div>
      </div>
    </div>

    <div class="recommend-section">
      <div id="placeholder" class="placeholder-text">
        🔥 구글 검색어 3일 트렌드를 분석하여<br>오늘의 <b>인기 메뉴</b>를 추천해 드려요! 😋
      </div>
      <div id="menuGrid" class="menu-grid" style="display: none;"></div>
    </div>

    <div class="button-group">
      <button class="recommend-btn" id="recommendBtn">🔥 오늘의 인기 메뉴</button>
    </div>
  </div>

  <div class="modal-overlay" id="recipeModal">
    <div class="modal-content">
      <div class="modal-header">
        <div class="modal-title" id="modalMenuName">🍲 메뉴명</div>
        <button class="close-btn" id="closeModalBtn">✕</button>
      </div>
      
      <div class="recipe-section">
        <h4>🛒 주요 재료</h4>
        <p id="modalIngredients">재료 정보</p>
      </div>

      <div class="recipe-section">
        <h4>🍳 3단계 초간단 조리법</h4>
        <ol id="modalSteps"></ol>
      </div>

      <div class="video-btn-group">
        <a href="#" target="_blank" class="video-btn youtube-btn" id="youtubeLink">▶️ 유튜브 영상</a>
        <a href="#" target="_blank" class="video-btn insta-btn" id="instaLink">📸 인스타그램</a>
      </div>
    </div>
  </div>

  <script>
    let fullMenuList = [];
    let currentIndex = 0;

    async function loadTrendingMenuData() {
      try {
        const response = await fetch('./menu_data.json?v=' + new Date().getTime());
        if (response.ok) {
          const data = await response.json();
          // 배열 형식이 맞는지 검증
          if (Array.isArray(data)) {
            fullMenuList = data;
          } else {
            fullMenuList = [];
          }
        }
      } catch (e) {
        fullMenuList = [];
      }
    }

    function initDate() {
      const now = new Date();
      const month = now.getMonth() + 1;
      const date = now.getDate();
      const days = ['일요일', '월요일', '화요일', '수요일', '목요일', '금요일', '토요일'];
      document.getElementById('currentDate').textContent = `${month}월 ${date}일`;
      document.getElementById('currentDay').textContent = days[now.getDay()];
    }

    function parseWeatherCode(code) {
      if (code === 0) return { text: "맑음", icon: "☀️" };
      if (code >= 1 && code <= 3) return { text: "구름조금", icon: "⛅" };
      if (code === 45 || code === 48) return { text: "안개", icon: "🌫️" };
      if (code >= 51 && code <= 67) return { text: "비", icon: "🌧️" };
      if (code >= 71 && code <= 77) return { text: "눈", icon: "❄️" };
      if (code >= 80 && code <= 82) return { text: "소나기", icon: "🌦️" };
      if (code >= 95) return { text: "뇌우", icon: "🌩️" };
      return { text: "흐림", icon: "☁️" };
    }

    async function getRegionName(lat, lon) {
      try {
        const res = await fetch(`https://api.bigdatacloud.net/data/reverse-geocode-client?latitude=${lat}&longitude=${lon}&localityLanguage=ko`);
        const data = await res.json();
        const city = data.city || data.locality || data.principalSubdivision;
        if (city) {
          return city.replace("서울특별시", "서울").replace("광역시", "").replace("특별자치시", "");
        }
      } catch (e) {
        console.log("지역명 조회 실패:", e);
      }
      return "서울";
    }

    async function fetchWeatherData(lat, lon, isFallback = false) {
      const weatherUrl = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current_weather=true`;
      
      try {
        const regionName = isFallback ? "서울" : await getRegionName(lat, lon);
        const res = await fetch(weatherUrl);
        const data = await res.json();

        if (data && data.current_weather) {
          const temp = Math.round(data.current_weather.temperature);
          const weatherInfo = parseWeatherCode(data.current_weather.weathercode);
          
          document.getElementById('weatherText').textContent = `${regionName} ${weatherInfo.icon} ${weatherInfo.text} (${temp}°C)`;
        } else {
          setFallbackWeather();
        }
      } catch (e) {
        setFallbackWeather();
      }
    }

    function initWeather() {
      if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(
          (pos) => {
            fetchWeatherData(pos.coords.latitude, pos.coords.longitude, false);
          },
          () => {
            fetchWeatherData(37.5665, 126.9780, true);
          },
          { timeout: 5000 }
        );
      } else {
        fetchWeatherData(37.5665, 126.9780, true);
      }
    }

    function setFallbackWeather() {
      document.getElementById('weatherText').textContent = "서울 🌡️ 날씨 정보 없음";
    }

    // 4개씩 포인터를 이동하며 자르는 함수
    function getNext4Menus() {
      if (currentIndex >= fullMenuList.length) {
        currentIndex = 0;
      }
      const selected = fullMenuList.slice(currentIndex, currentIndex + 4);
      currentIndex += 4;
      return selected;
    }

    document.getElementById('recommendBtn').addEventListener('click', () => {
      const placeholder = document.getElementById('placeholder');
      const menuGrid = document.getElementById('menuGrid');

      if (!fullMenuList || fullMenuList.length === 0) {
        placeholder.style.display = 'block';
        placeholder.innerHTML = '⚠️ <b>데이터를 불러오지 못했습니다.</b><br>잠시 후 다시 시도해 주세요.';
        menuGrid.style.display = 'none';
        return;
      }

      const selectedMenus = getNext4Menus();
      menuGrid.innerHTML = '';
      
      selectedMenus.forEach(item => {
        const card = document.createElement('div');
        card.className = 'menu-card';
        card.innerHTML = `
          <div class="rank-badge">${item.rank_badge || '⭐ 추천 메뉴'}</div>
          <div class="menu-emoji">${item.emoji || '🍲'}</div>
          <div class="menu-name">${item.name}</div>
          <div class="sub-tip">레시피 보기 👆</div>
        `;
        card.addEventListener('click', () => openRecipeModal(item));
        menuGrid.appendChild(card);
      });

      placeholder.style.display = 'none';
      menuGrid.style.display = 'grid';
      document.getElementById('recommendBtn').textContent = '🔄 다른 인기 메뉴 추천';
    });

    function openRecipeModal(menu) {
      document.getElementById('modalMenuName').textContent = `${menu.emoji || '🍲'} ${menu.name}`;
      document.getElementById('modalIngredients').textContent = menu.ingredients;
      
      const stepsList = document.getElementById('modalSteps');
      stepsList.innerHTML = '';
      if (menu.steps && menu.steps.length > 0) {
        menu.steps.forEach(step => {
          const li = document.createElement('li');
          li.textContent = step;
          stepsList.appendChild(li);
        });
      }

      const encodedName = encodeURIComponent(menu.name + " 레시피");
      document.getElementById('youtubeLink').href = `https://www.youtube.com/results?search_query=${encodedName}`;
      document.getElementById('instaLink').href = `https://www.instagram.com/explore/tags/${encodeURIComponent(menu.name)}`;

      document.getElementById('recipeModal').style.display = 'flex';
    }

    document.getElementById('closeModalBtn').addEventListener('click', () => {
      document.getElementById('recipeModal').style.display = 'none';
    });

    initDate();
    initWeather();
    loadTrendingMenuData();
  </script>
</body>
</html>
